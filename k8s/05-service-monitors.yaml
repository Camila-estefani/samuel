apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: menu-service-monitor
  namespace: restaurante
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: menu-service
      monitored: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - restaurante
---
