apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-service
  namespace: restaurante
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidos-service
  template:
    metadata:
      labels:
        app: pedidos-service
    spec:
      containers:
        - name: pedidos-service
          image: pedidos-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: MENU_SERVICE_URL
              value: "http://menu-service.restaurante.svc.cluster.local:8080"
            - name: MENU_TIMEOUT_SECONDS
              value: "3"
          livenessProbe:
            httpGet:
              path: /api/pedidos/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/pedidos/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
